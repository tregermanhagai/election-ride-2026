services:
  - type: web
    name: election-ride-2026
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
  - type: web
    name: election-sign-2026
    runtime: static
    # The balcony-sign page lives in shelet/; publish it at the root of its own address
    buildCommand: mkdir -p dist && cp -r assets styles.css main.js dist/ && cp shelet/index.html dist/index.html
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
